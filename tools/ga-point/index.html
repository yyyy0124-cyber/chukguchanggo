<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공격포인트 계산 | 축구창고</title><meta name="description" content="골과 도움의 합계, 경기당 평균을 확인합니다."><link rel="canonical" href="https://chukguchanggo.com/tools/ga-point/"><link rel="stylesheet" href="/reader.css?v=0915-content2"><link rel="stylesheet" href="/content-review.css?v=0915-content2"><meta name="robots" content="index,follow"></head><body><header><a href="/">축구창고</a></header><nav aria-label="주요 메뉴"><a href="/tools/">도구</a><a href="/mag/">매거진</a><a href="/#intl">뉴스</a></nav><main><p class="meta">축구창고 편집 · 2026.09.15 정리</p><h1>공격포인트 계산</h1><p class="lead">골과 도움의 합계, 경기당 평균을 확인합니다.</p><section class="panel"><h2>직접 사용하기</h2><form id="tool-form"><div class="fields"><label>골<input name="g" type="number" value="12" min="0" max="1000000" step="1" required></label><label>도움<input name="a" type="number" value="7" min="0" max="1000000" step="1" required></label><label>경기 수<input name="m" type="number" value="25" min="1" max="1000000" step="1" required></label></div><button type="submit">결과 확인</button><button type="button" id="reset-tool" class="secondary">초기화</button></form><div id="tool-result" class="result" role="status" hidden></div><div id="tool-actions"></div><button type="button" id="copy-result" hidden>결과 복사</button><noscript><p>기능을 사용하려면 자바스크립트를 켜세요. 아래 계산 기준은 그대로 읽을 수 있습니다.</p></noscript></section><h2>계산·동작 기준</h2><p>공격포인트 = 골 + 도움. 경기당 평균 = 공격포인트 ÷ 경기 수.</p><h2>사용 예시</h2><p>12골과 7도움, 25경기라면 19개, 경기당 0.76개입니다.</p><h2>결과를 읽을 때</h2><p>같은 대회와 집계 기간끼리 비교하세요. 출전시간 차이는 이 평균에 반영되지 않습니다.</p><p><a href="/tools/">같은 주제의 다른 도구 찾기</a> · <a href="/mag/">매거진 읽기</a></p></main><footer><a href="/about.html">소개</a><a href="/contact.html">문의</a><a href="/privacy.html">개인정보처리방침</a><a href="/terms.html">이용약관</a></footer><script src="/all-tools.js?v=0915-content2" defer></script></body></html>
