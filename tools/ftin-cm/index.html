<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피트·인치를 센티미터로 | 축구창고</title><meta name="description" content="길이 단위 표기를 cm로 바꿉니다."><link rel="canonical" href="https://chukguchanggo.com/tools/ftin-cm/"><link rel="stylesheet" href="/reader.css?v=0915-content2"><link rel="stylesheet" href="/content-review.css?v=0915-content2"><meta name="robots" content="index,follow"></head><body><header><a href="/">축구창고</a></header><nav aria-label="주요 메뉴"><a href="/tools/">도구</a><a href="/mag/">매거진</a><a href="/#intl">뉴스</a></nav><main><p class="meta">축구창고 편집 · 2026.09.15 정리</p><h1>피트·인치를 센티미터로</h1><p class="lead">길이 단위 표기를 cm로 바꿉니다.</p><section class="panel"><h2>직접 사용하기</h2><form id="tool-form"><div class="fields"><label>피트 (ft)<input name="ft" type="number" value="6" min="0" max="1000" step="1" required></label><label>나머지 인치 (in)<input name="inch" type="number" value="2" min="0" max="11.99" step="0.01" required></label></div><button type="submit">결과 확인</button><button type="button" id="reset-tool" class="secondary">초기화</button></form><div id="tool-result" class="result" role="status" hidden></div><div id="tool-actions"></div><button type="button" id="copy-result" hidden>결과 복사</button><noscript><p>기능을 사용하려면 자바스크립트를 켜세요. 아래 계산 기준은 그대로 읽을 수 있습니다.</p></noscript></section><h2>계산·동작 기준</h2><p>1ft = 30.48cm, 1in = 2.54cm. 두 길이를 더합니다.</p><h2>사용 예시</h2><p>6ft 2in = 187.96cm입니다.</p><h2>결과를 읽을 때</h2><p>인치 칸에는 12 미만의 나머지를 입력하세요. 12in은 1ft로 올립니다.</p><p><a href="/tools/">같은 주제의 다른 도구 찾기</a> · <a href="/mag/">매거진 읽기</a></p></main><footer><a href="/about.html">소개</a><a href="/contact.html">문의</a><a href="/privacy.html">개인정보처리방침</a><a href="/terms.html">이용약관</a></footer><script src="/all-tools.js?v=0915-content2" defer></script></body></html>
