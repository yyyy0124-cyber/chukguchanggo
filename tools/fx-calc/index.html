<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해외 구매 금액 환산 | 축구창고</title><meta name="description" content="상품가와 배송비를 같은 통화로 입력해 원화로 바꿉니다."><link rel="canonical" href="https://chukguchanggo.com/tools/fx-calc/"><link rel="stylesheet" href="/reader.css?v=0915-content2"><link rel="stylesheet" href="/content-review.css?v=0915-content2"><meta name="robots" content="index,follow"><link rel="stylesheet" href="/result-share.css?v=0915-structure4"></head><body><header><a href="/">축구창고</a></header><nav aria-label="주요 메뉴"><a href="/tools/">도구</a><a href="/mag/">매거진</a><a href="/#intl">뉴스</a></nav><main><p class="meta">축구창고 편집 · 2026.09.15 정리</p><h1>해외 구매 금액 환산</h1><p class="lead">상품가와 배송비를 같은 통화로 입력해 원화로 바꿉니다.</p><section class="panel"><h2>직접 사용하기</h2><form id="tool-form"><div class="fields"><label>상품가 (외화)<input name="price" type="number" value="100" min="0" max="10000000" step="0.01" required></label><label>배송비 (같은 외화)<input name="shipping" type="number" value="20" min="0" max="10000000" step="0.01" required></label><label>외화 1단위당 원화<input name="rate" type="number" value="1500" min="0.01" max="1000000" step="0.01" required></label></div><button type="submit">결과 확인</button><button type="button" id="reset-tool" class="secondary">초기화</button></form><div id="tool-result" class="result" role="status" hidden></div><div id="tool-actions"></div><button type="button" id="copy-result" hidden>결과 복사</button><noscript><p>기능을 사용하려면 자바스크립트를 켜세요. 아래 계산 기준은 그대로 읽을 수 있습니다.</p></noscript></section><h2>계산·동작 기준</h2><p>(상품가 + 배송비) × 입력 환율.</p><h2>사용 예시</h2><p>상품가 100, 배송비 20, 환율 1,500을 가정하면 180,000원입니다.</p><h2>결과를 읽을 때</h2><p>기본값은 실제 환율이 아닙니다. 결제 수수료·세금·통관 비용을 제외한 단순 환산입니다.</p><section class="related-next"><h2>이어서 사용할 도구와 읽을거리</h2><a href="/tools/hr-zone/">나이 기반 심박수 참고값 →</a><a href="/tools/sprint-speed/">달리기 평균 속도 →</a></section></main><footer><a href="/about.html">소개</a><a href="/contact.html">문의</a><a href="/
