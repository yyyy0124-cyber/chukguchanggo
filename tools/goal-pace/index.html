<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>득점 페이스 | 축구창고</title><meta name="description" content="현재 경기당 득점을 지정한 경기 수로 환산합니다."><link rel="canonical" href="https://chukguchanggo.com/tools/goal-pace/"><link rel="stylesheet" href="/reader.css?v=0915-content2"><link rel="stylesheet" href="/content-review.css?v=0915-content2"><meta name="robots" content="index,follow"><link rel="stylesheet" href="/result-share.css?v=0915-structure4"></head><body><header><a href="/">축구창고</a></header><nav aria-label="주요 메뉴"><a href="/tools/">도구</a><a href="/mag/">매거진</a><a href="/#intl">뉴스</a></nav><main><p class="meta">축구창고 편집 · 2026.09.15 정리</p><h1>득점 페이스</h1><p class="lead">현재 경기당 득점을 지정한 경기 수로 환산합니다.</p><section class="panel"><h2>직접 사용하기</h2><form id="tool-form"><div class="fields"><label>현재 골<input name="g" type="number" value="10" min="0" max="1000000" step="1" required></label><label>치른 경기<input name="m" type="number" value="15" min="1" max="1000000" step="1" required></label><label>환산할 전체 경기<input name="total" type="number" value="38" min="1" max="1000000" step="1" required></label></div><button type="submit">결과 확인</button><button type="button" id="reset-tool" class="secondary">초기화</button></form><div id="tool-result" class="result" role="status" hidden></div><div id="tool-actions"></div><button type="button" id="copy-result" hidden>결과 복사</button><noscript><p>기능을 사용하려면 자바스크립트를 켜세요. 아래 계산 기준은 그대로 읽을 수 있습니다.</p></noscript></section><h2>계산·동작 기준</h2><p>현재 골 ÷ 치른 경기 × 전체 경기.</p><h2>사용 예시</h2><p>15경기 10골을 38경기로 환산하면 약 25.33골입니다.</p><h2>결과를 읽을 때</h2><p>실제 예상 득점이나 출전을 보장하지 않는 단순 환산입니다. 전체 경기는 치른 경기 이상이어야 합니다.</p><section class="related-next"><h2>이어서 사용할 도구와 읽을거리</h2><a href="/tools/fpl-budget/">FPL 예산 메모 →</a><a href="/tools/card-pace/">경고 기록과 목표 장수 →</a></section></main><footer><a href="/about.html">소개</a><a href="/contact.html">문의</a><a href="/privacy.html">개인정보처리방침</a><a href="/terms.html">이용약관</a></footer><script src="/all-tools.js?v=0915-structure4" defer></script><script src="/result-share.js?v=0915-structure4" defer></script></body></html>
